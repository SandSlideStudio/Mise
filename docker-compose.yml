name: mise

# Old logs are dropped instead of filling the disk.
x-logging: &logging
  driver: local
  options:
    max-size: 5m
    max-file: '2'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mise}
      POSTGRES_DB: ${POSTGRES_DB:-mise}
    ports:
      # Published so local development can reach it. Remove this in production.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    # Sized for a small machine such as a Raspberry Pi; a kitchen's database is
    # a few megabytes. Rarer checkpoints and compressed page images mean fewer
    # writes to an SD card.
    command: >-
      postgres
      -c shared_buffers=32MB
      -c max_connections=25
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=128MB
      -c checkpoint_timeout=15min
      -c wal_compression=on
      -c log_checkpoints=off
    logging: *logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mise} -d ${POSTGRES_DB:-mise}']
      interval: 1m
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-mise}:${POSTGRES_PASSWORD:-mise}@db:5432/${POSTGRES_DB:-mise}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:-}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    logging: *logging

volumes:
  db-data:
  uploads:
  backups:
