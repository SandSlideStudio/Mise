name: Release

# Push a tag such as v1.0.0 to publish that version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.newest.outputs.latest }}
      major: ${{ steps.newest.outputs.major }}
      minor: ${{ steps.newest.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      # A fix for an older version (2.1.2 after 2.2.4) must not become "latest",
      # or move "2" back: kitchens following those would go back a version.
      - id: newest
        name: Whether this is the newest version, overall and in its line
        run: |
          v="${GITHUB_REF_NAME#v}"
          major="${v%%.*}"
          minor="$(echo "$v" | cut -d. -f1-2)"
          newest() { git tag -l "$1" | sed 's/^v//' | sort -V | tail -n 1; }
          is() { [ "$v" = "$1" ] && echo true || echo false; }
          {
            echo "latest=$(is "$(newest 'v*.*.*')")"
            echo "major=$(is "$(newest "v$major.*.*")")"
            echo "minor=$(is "$(newest "v$minor.*")")"
          } | tee -a "$GITHUB_OUTPUT"

  # Exactly the checks every push to main gets, browser tests included.
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  image:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry names are lower case; the account name may not be.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/mise-kitchen
          # 1.2.3, 1.2 and 1, so a kitchen can follow whichever it likes; the
          # shorter ones only move forward.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.minor }}
            type=semver,pattern={{major}},enable=${{ needs.version.outputs.major }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest }}
      # Normal PCs and mini PCs, plus ARM boxes such as a Raspberry Pi.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Plain text comparison: the heading is "## 1.0.0" or "## 1.0.0 (...)",
          # and a version's dots must not be read as a pattern.
          awk -v v="$version" '
            $0 == "## " v || index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      # What the installer downloads, from this release rather than from main.
      # A release can't hold a file whose name starts with a dot.
      - name: Installer files and their checksums
        run: |
          mkdir dist
          cp deploy/install.sh deploy/compose.yaml deploy/Caddyfile dist/
          cp deploy/.env.example dist/env.example
          (cd dist && sha256sum install.sh compose.yaml Caddyfile env.example > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Mise $GITHUB_REF_NAME" --notes-file notes.md \
            --latest=${{ needs.version.outputs.latest }} \
            dist/install.sh dist/compose.yaml dist/Caddyfile dist/env.example dist/SHA256SUMS
